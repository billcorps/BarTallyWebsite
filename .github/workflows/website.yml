name: Website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/BarTallyWebsite/' }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://billcorps.github.io/BarTallyWebsite/' }}
      VITE_DEVELOPER_NAME: ${{ vars.VITE_DEVELOPER_NAME }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
      VITE_SOCIAL_IMAGE: ${{ vars.VITE_SOCIAL_IMAGE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser behavior
        id: browser_tests
        run: npm run test:e2e
      - name: Preserve failed browser reports
        if: failure() && steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check public privacy contact before publishing
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: npm run check:publish
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
